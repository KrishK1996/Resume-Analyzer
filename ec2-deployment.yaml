AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation Template to deploy AI Resume Analyzer on an EC2 instance with Docker.

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type for running the Dockerized application.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access.
    ConstraintDescription: Must be the name of an existing EC2 KeyPair.

  GroqApiKey:
    Type: String
    NoEcho: true
    Description: Groq API key for AI Resume analysis.
    MinLength: 10

  LatestUbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: SSM Parameter to automatically fetch the latest Ubuntu 24.04 LTS x86_64 AMI ID.

  GitHubRepoUrl:
    Type: String
    Default: https://github.com/KrishK1996/Resume-Analyzer.git
    Description: Git repository URL containing the application source code.

Resources:
  ResumeAnalyzerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for AI Resume Analyzer web application
      GroupName: resume-analyzer-sg
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          CidrIp: 0.0.0.0/0
          Description: Allow inbound web traffic on port 8501
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: Allow SSH access
      Tags:
        - Key: Name
          Value: resume-analyzer-sg

  ResumeAnalyzerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: !Ref LatestUbuntuAmiId
      SecurityGroupIds:
        - !Ref ResumeAnalyzerSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -e
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

          echo "Starting EC2 UserData provisioning..."

          # 1. Update system packages
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg lsb-release git

          # 2. Configure 2GB swap space to ensure smooth Docker builds on micro instances
          if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # 3. Install Docker Engine
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
            $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

          systemctl enable docker
          systemctl start docker
          usermod -aG docker ubuntu || true

          # 4. Clone Application Repository
          cd /home/ubuntu
          git clone ${GitHubRepoUrl} app
          cd app

          # 5. Configure environment variables
          mkdir -p backend
          echo "GROQ_API_KEY=${GroqApiKey}" > backend/.env
          echo "GROQ_MODEL=llama-3.3-70b-versatile" >> backend/.env
          echo "PORT=8501" >> backend/.env
          echo "HOST=0.0.0.0" >> backend/.env
          chown -R ubuntu:ubuntu /home/ubuntu/app

          # 6. Build and launch Docker container
          docker build -t resume-analyzer:latest .
          docker run -d \
            --name resume_analyzer_app \
            --restart unless-stopped \
            -p 8501:8501 \
            --env-file backend/.env \
            resume-analyzer:latest

          echo "Deployment completed successfully on port 8501."
      Tags:
        - Key: Name
          Value: resume-analyzer-instance

Outputs:
  InstanceId:
    Description: Instance ID of the Resume Analyzer EC2 instance
    Value: !Ref ResumeAnalyzerInstance

  PublicIp:
    Description: Public IP address of the EC2 instance
    Value: !GetAtt ResumeAnalyzerInstance.PublicIp

  ApplicationUrl:
    Description: URL to access the Resume Analyzer web application
    Value: !Sub "http://${ResumeAnalyzerInstance.PublicIp}:8501"
