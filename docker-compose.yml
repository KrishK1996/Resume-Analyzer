version: '3.8'

services:
  resume-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_analyzer_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - PORT=8501
      - HOST=0.0.0.0
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
